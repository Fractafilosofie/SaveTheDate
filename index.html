<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maricel &amp; Thorfinn — A Beltane Handfasting</title>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* **REPLACE** ANDASIA_FONT_FILE_URL with the URL of your own hosted Andasia font file
     (upload the .woff2/.ttf/.otf to your wedding website alongside this page).
     Falls back to Parisienne automatically if the file isn't found. */
  @font-face {
    font-family: 'Andasia';
    src: url('ANDASIA_FONT_FILE_URL') format('woff2');
    font-weight: normal;
    font-style: normal;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background-color: #e8dcc0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: #3a5f6b;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background-color: #faf4e3;
    padding: 44px 32px 36px 32px;
    text-align: center;
  }
  .flourish {
    display: block;
    margin: 0 auto 8px auto;
  }
  h1 {
    font-family: 'Andasia', 'Parisienne', cursive;
    font-weight: 400;
    font-size: 44px;
    color: #2f6b7a;
    margin: 4px 0 4px 0;
    line-height: 1.2;
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #4a7d8c;
    margin: 0 0 24px 0;
  }
  .video-wrap {
    position: relative;
    width: 380px;
    max-width: 100%;
    aspect-ratio: 9 / 16;
    margin: 0 auto;
    border-radius: 4px;
    overflow: hidden;
    border: 6px solid #faf4e3;
    outline: 1px solid #cfe0da;
    background-color: #d8d0bd;
  }
  .video-wrap video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: 0;
  }
  .details {
    margin-top: 28px;
    font-size: 18px;
    line-height: 1.7;
  }
  .details .names {
    font-family: 'Andasia', 'Parisienne', cursive;
    font-size: 28px;
    color: #2f6b7a;
    display: block;
    margin-top: 6px;
  }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #5b8794;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="flourish" src="https://raw.githubusercontent.com/Fractafilosofie/SaveTheDate/main/flourish-top.png" width="120" height="30" alt="" />

    <h1>Maricel &amp; Thorfinn</h1>
    <div class="subtitle">A Beltane Handfasting &bull; 1st May 2027</div>

    <div class="video-wrap">      <video controls playsinline poster="https://raw.githubusercontent.com/Fractafilosofie/SaveTheDate/main/thumbnail.jpg">
        <source src="https://raw.githubusercontent.com/Fractafilosofie/SaveTheDate/main/Maricel_Thorfinn_SaveTheDate.mp4" type="video/mp4">
        Your browser doesn't support embedded video. <a href="https://raw.githubusercontent.com/Fractafilosofie/SaveTheDate/main/Maricel_Thorfinn_SaveTheDate.mp4">Watch it here</a> instead.
      </video>
    </div>

    <div class="details">
      We can't wait to celebrate with you at Tyninghame.
      <span class="names">With love,<br />Maricel &amp; Thorfinn</span>
    </div>

    <div style="margin-top:20px;">
      <a href="https://withjoy.com/maricel-and-thorfinn?utm_medium=web&utm_source=joy&utm_campaign=website_overview_copy" target="_blank" style="display:inline-block; padding:11px 28px; background-color:#2f6b7a; color:#ffffff; font-family:'Cormorant Garamond', Georgia, serif; font-size:14px; letter-spacing:2px; text-transform:uppercase; text-decoration:none; border-radius:2px;">
        Visit Our Website
      </a>
    </div>

    <img class="flourish" style="margin-top:24px;" src="https://raw.githubusercontent.com/Fractafilosofie/SaveTheDate/main/flourish-bottom.png" width="120" height="30" alt="" />

    <div class="footer">Tyninghame &bull; East Lothian &bull; Scotland</div>
  </div>
</body>
</html>
