<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maricel &amp; Thorfinn — A Beltane Handfasting</title>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* **REPLACE** ANDASIA_FONT_FILE_URL with the URL of your own hosted Andasia font file
     (upload the .woff2/.ttf/.otf to your wedding website alongside this page).
     Falls back to Parisienne automatically if the file isn't found. */
  @font-face {
    font-family: 'Andasia';
    src: url('ANDASIA_FONT_FILE_URL') format('woff2');
    font-weight: normal;
    font-style: normal;
  }
</style>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background-color: #e8dcc0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: #3a5f6b;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background-color: #faf4e3;
    padding: 44px 32px 36px 32px;
    text-align: center;
  }
  .flourish {
    display: block;
    margin: 0 auto 8px auto;
  }
  h1 {
    font-family: 'Andasia', 'Parisienne', cursive;
    font-weight: 400;
    font-size: 44px;
    color: #2f6b7a;
    margin: 4px 0 4px 0;
    line-height: 1.2;
  }
  .subtitle {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #4a7d8c;
    margin: 0 0 24px 0;
  }
  .video-wrap {
    position: relative;
    width: 270px;
    max-width: 100%;
    aspect-ratio: 9 / 16;
    margin: 0 auto;
    border-radius: 4px;
    overflow: hidden;
    border: 6px solid #faf4e3;
    outline: 1px solid #cfe0da;
    background-color: #d8d0bd;
  }
  .video-wrap iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .details {
    margin-top: 28px;
    font-size: 18px;
    line-height: 1.7;
  }
  .details .names {
    font-family: 'Andasia', 'Parisienne', cursive;
    font-size: 28px;
    color: #2f6b7a;
    display: block;
    margin-top: 6px;
  }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #5b8794;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="flourish" width="120" height="30" viewBox="0 0 120 30" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,15 C30,5 40,25 60,15 C80,5 90,25 110,15" stroke="#2f6b7a" stroke-width="1.2" fill="none"/>
      <circle cx="60" cy="15" r="3" fill="#2f6b7a"/>
      <circle cx="35" cy="12" r="2" fill="#6fa3ad"/>
      <circle cx="85" cy="18" r="2" fill="#6fa3ad"/>
    </svg>

    <h1>Maricel &amp; Thorfinn</h1>
    <div class="subtitle">A Beltane Handfasting &bull; 1st May 2027</div>

    <div class="video-wrap">
      <!-- If the video doesn't load, replace the src below with the embed code from
           Vimeo's own Share > Embed panel, which includes a privacy hash for unlisted videos -->
      <iframe src="https://player.vimeo.com/video/1226741776?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="Maricel_Thorfinn_SaveTheDate" allowfullscreen></iframe>
    </div>

    <div class="details">
      We can't wait to celebrate with you at Tyninghame.
      <span class="names">With love,<br />Maricel &amp; Thorfinn</span>
    </div>

    <svg class="flourish" style="margin-top:24px;" width="120" height="30" viewBox="0 0 120 30" xmlns="http://www.w3.org/2000/svg">
      <path d="M10,15 C30,25 40,5 60,15 C80,25 90,5 110,15" stroke="#2f6b7a" stroke-width="1.2" fill="none"/>
      <circle cx="60" cy="15" r="3" fill="#2f6b7a"/>
      <circle cx="35" cy="18" r="2" fill="#6fa3ad"/>
      <circle cx="85" cy="12" r="2" fill="#6fa3ad"/>
    </svg>

    <div class="footer">Tyninghame &bull; East Lothian &bull; Scotland</div>
  </div>  <script src="https://player.vimeo.com/api/player.js"></script>
</body>
</html>
